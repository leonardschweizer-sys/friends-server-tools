advancements:
  # Advancements only make progress in these worlds. In all others (lobby, creative, speedrun) nothing is earned.
  # Empty list = everywhere.
  worlds: [world, world_nether, world_the_end]
  # BACAP's rewards (chat message, items, trophies, XP) are given once per player and advancement.
  # Multiverse-Inventories takes advancements away and grants them back when you change world group, and BACAP
  # paid out again every time. FriendsTools keeps BACAP's reward settings off and switches them on only for a real
  # first completion. (control: false = leave BACAP's /function blazeandcave:config settings alone)
  bacap-rewards:
    control: true
    messages: true
    items: true
    trophies: true
    xp: true
    # BACAP co-op mode: when one player gets an advancement, everyone online gets it too
    coop: false
    # Advancements with a prize item from custom-items give that instead of BACAP's item reward and trophy
    # (BACAP's message and XP still come)
    not-with-prize-items: true
  # Prize items from custom-items go to everyone who completes their advancement
  prize-items: true
  # After coming into survival, advancements granted in this time are Multiverse-Inventories putting them back
  ignore-seconds-after-world-change: 3
  # Far-travel advancements the world border makes impossible: they count once you get this far from 0,0 (x or z,
  # within 2 blocks, since nobody can stand exactly on the border). If a world's border comes first, reaching
  # that border counts. Add more lines the same way ("advancement": distance).
  reach-distance:
    "blazeandcave:challenges/farlander": 49999

titles:
  # Titles come from plugins/FriendsTools/titles.yml (made with the planner). Everyone who completes an advancement in
  # survival unlocks its title; "first" titles only go to the first player. /titles to pick one.
  in-chat: true
  in-tab: true
  # Sort the tab list by the worn title: only-once on top, then very hard down to very easy, no title last
  sort-tab: true
  # Tell everyone when someone gets an only-once title
  announce-only-once: true
  # How the worn title looks in front of the name
  badge: "<dark_gray>[</dark_gray><title><dark_gray>]</dark_gray> "
  colors:
    # By the "rank" in titles.yml: 0 = very easy, 1 = easy, 2 = a bit harder, 3 = hard, 4 = very hard.
    # Gold is only for only-once titles.
    rank-0: "<#ff8ac8><title>"
    rank-1: "<#8ff0a4><title>"
    rank-2: "<#5cb8ff><title>"
    rank-3: "<#b98cff><title>"
    rank-4: "<gradient:#ff6b6b:#e0283c><title></gradient>"
    only-once: "<gradient:#ffe066:#ffaa00><title></gradient>"
    # Extra colors a single title can use with "color: pink" in titles.yml (a color tag like "<#ff8ac8>" works too)
    pink: "<#ff8ac8><title>"

prize-powers:
  # Nokia 3310: minutes until it can save you again
  totem-recharge-minutes: 10

buff-golem:
  # Prize golem stats (a normal iron golem has 100 health and 15 attack damage)
  health: 200
  attack-damage: 22

raids:
  # Captains that come with a raid wave drop an ominous bottle (vanilla only drops one outside raids),
  # so raid farms can keep going
  captain-drops-ominous-bottle: true

fixes:
  # Turns attribute swapping back on (Paper's unsupported-settings.update-equipment-on-player-actions: false).
  # Applied right away and written to config/paper-global.yml.
  attribute-swapping: true
  # Get players off cushions, boats, horses etc. when they log out. Otherwise the vehicle is respawned
  # in the lobby at their survival coordinates on the next join (cushions break, horses end up in the lobby).
  dismount-on-quit: true
  # Multiverse-Inventories re-grants advancements when you change world group and labels them
  # "mvinv:suppressed", which Paper then shows in chat. This hides that line.
  hide-mvinv-suppressed: true

weather-fix:
  # Re-sends the correct weather after joining and after changing worlds
  # (fixes rain from survival still showing in the lobby)
  enabled: true

messages:
  prefix: "<dark_gray>[<gold>Server</gold>]</dark_gray> "
  not-enough-diamonds: "<red>You don't have enough diamonds to do this right now."
  biome-usage: "<gray>Usage: <white>/biome [name]</white> (costs <aqua><cost> diamonds</aqua>, changes the chunk you stand in)"
  biome-unknown: "<red>Unknown or not allowed biome: <white><biome></white>. Use tab to see the list."
  biome-wrong-world: "<red>You can only change biomes in survival."
  biome-done: "<green>This chunk is now <white><biome></white>. <gray>(-<cost> diamonds)"
  chestlog-not-container: "<red>Look at a chest, barrel or shulker box (max <distance> blocks away)."
  chestlog-empty: "<gray>Nothing logged for this container yet."
  chestlog-header: "<gold>Chest log</gold> <gray><x> <y> <z> · page <page>/<pages></gray>"
  chestlog-line: "<dark_gray><ago></dark_gray> <yellow><player></yellow> <white><action></white>"
  teambal-no-team: "<red>You are not in a team."
  teambal-own: "<gray>Team <white><team></white> has <aqua><amount> diamonds</aqua> in its team ender chest."
  teambal-top-header: "<gold>Richest teams</gold> <gray>(diamonds in team ender chest)"
  teambal-top-line: "<gray><rank>.</gray> <white><team></white> <aqua><amount></aqua>"
  teambal-unavailable: "<red>BetterTeams is not installed."
  speedrun-confirm: "<yellow>Click again within <seconds> seconds to reset the speedrun world for everyone.</yellow> <gray>(<players> player(s) in the run right now)"
  speedrun-resetting: "<gray>Resetting the speedrun world, this takes about a minute...</gray>"
