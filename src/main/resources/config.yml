# FriendsTools config. After editing, run /friendstools reload (or restart).
# Messages use MiniMessage formatting: <red>, <gray>, <yellow>, <b> ...

chestlog:
  enabled: true
  # How many entries are kept per chest/barrel/shulker box (oldest are dropped first)
  max-entries-per-container: 100
  # Entries older than this are removed (0 = keep forever)
  keep-days: 90
  # Entries shown per page in /chestlog
  page-size: 8
  # How far away the container you look at may be
  max-distance: 6

biome:
  enabled: true
  cost-diamonds: 32
  # Worlds where /biome works (Bukkit world names)
  worlds:
    - world
  # true = players can pick every biome the server knows except Nether and End biomes,
  # so biomes added by Minecraft updates (like dappled_forest in 26.3) show up automatically.
  # false = only the biomes in "allowed" below.
  all-overworld-biomes: true
  # Never offered, in both modes. Cave biomes make no sense for a whole chunk.
  blocked:
    - deep_dark
    - dripstone_caves
    - lush_caves
  # Only used when all-overworld-biomes is false. Biome names without "minecraft:".
  allowed:
    - plains
    - sunflower_plains
    - meadow
    - forest
    - flower_forest
    - birch_forest
    - old_growth_birch_forest
    - dark_forest
    - pale_garden
    - cherry_grove
    - taiga
    - old_growth_pine_taiga
    - old_growth_spruce_taiga
    - snowy_taiga
    - snowy_plains
    - ice_spikes
    - grove
    - snowy_slopes
    - swamp
    - mangrove_swamp
    - jungle
    - sparse_jungle
    - bamboo_jungle
    - savanna
    - savanna_plateau
    - windswept_savanna
    - windswept_hills
    - windswept_forest
    - desert
    - badlands
    - wooded_badlands
    - eroded_badlands
    - beach
    - snowy_beach
    - stony_shore
    - river
    - frozen_river
    - mushroom_fields
    - dappled_forest
    - ocean
    - warm_ocean
    - lukewarm_ocean
    - cold_ocean
    - frozen_ocean

team-balance:
  enabled: true
  # A diamond block counts as 9 diamonds
  count-diamond-blocks: true
  # Also count diamonds inside shulker boxes stored in the team ender chest
  count-inside-shulkers: true
  # Also count diamonds inside bundles (any color), including bundles inside shulker boxes
  # and bundles inside bundles
  count-inside-bundles: true
  # Recount all teams every X minutes (0 = only when someone closes the team ender chest)
  recount-minutes: 10

speedrun:
  enabled: true
  # The speedrun worlds. All of them are regenerated on reset (the overworld first).
  worlds:
    - speedrun
    - speedrun_nether
    - speedrun_the_end
  # Players who are in the run get sent here before the reset
  lobby-world: lobby
  # Multiverse-Inventories group of the speedrun worlds. Its inventories, XP, beds, advancements
  # and last locations are wiped on reset. Set to "" to keep them.
  inventory-group: speedrun
  # One new random seed for all speedrun worlds (like vanilla). false = a different seed per world
  same-seed: true
  # Players have to click the reset NPC twice within this many seconds (0 = no second click)
  confirm-seconds: 10
  # Minimum time between two resets
  cooldown-seconds: 60
  # Death and advancement messages from the speedrun worlds are only shown to players in the run,
  # not in global chat and not on Discord
  run-only-messages: true

stasis:
  # A fishing bobber resting on a wooden or weighted pressure plate becomes a lasting link: an invisible
  # armor stand keeps the plate pressed even when the bobber disappears (portal, other world, relog).
  # Using any fishing rod again, from anywhere, removes it and fires the stasis. One link per player.
  enabled: true
  worlds:
    - world
    - world_nether
    - world_the_end

tab:
  # Tab list names: BetterTeams team tag + name in team color + [ping]. Replaces TabListPing, which hid team tags.
  enabled: true
  show-ping: true
  update-seconds: 3

login:
  # Login system for offline mode, so cracked players can join without risk for everyone else.
  # While online-mode=true it only remembers every player who joins as a protected name.
  # - Everyone who played before keeps exactly the same ID (inventory, advancements, teams, ranks).
  # - Protected names (all existing players, and anyone who uses /premium) must pass Mojang's login
  #   check on every join, so a cracked client can't use them. No password needed.
  # - Cracked players must be on the whitelist and set a password with /register on their first join.
  enabled: true
  # The Mojang check for protected names (needs PacketEvents). If it ever breaks, set this to false:
  # protected players then log in with a password instead (first /register only from their last known IP,
  # or an admin sets one with /auth setpassword).
  premium-verification: true
  # Seconds a player has to /login or /register before being kicked
  timeout-seconds: 90
  # Same IP logs in automatically for this many days (0 = always ask for the password)
  session-days: 30
  min-password-length: 6
  # Wrong passwords before a kick
  max-attempts: 5

pvp:
  # /pvp: everyone decides for themselves. Off by default (only the name is shown).
  # Two players can only hurt each other when BOTH have PvP on. That covers hits, arrows, tridents and other
  # projectiles, splash and lingering potions (healing potions still work), tamed wolves, fire aspect/flame,
  # TNT they lit, end crystals, channeling lightning, and knockback from wind charges, maces and fishing rods.
  enabled: true
  # Tamed animals (dogs, cats, horses...) of a player with PvP off can't be hurt by other players either
  protect-pets: true
  # After a PvP hit (given or taken) PvP can't be turned off for this many seconds
  combat-seconds: 30
  # Shown next to the name of players with PvP on (MiniMessage)
  marker: "<red>⚔</red>"
  marker-in-tab: true
  # Also above the head, after the team tag and name (needs PacketEvents)
  marker-above-head: true

death-heads:
  # Every player death drops the player's head, also with keepInventory
  enabled: true
  # Death message and date on the head
  lore: true

disc-upload:
  # /upload gives a player a private link to a small website where they upload an mp3, wav or flac file.
  # It goes straight into plugins/CustomDiscs/musicdata, and a chat button burns it onto the disc in their hand.
  # Songs stored on the server never break, unlike SoundCloud/YouTube discs.
  # Needs its own port: open one in the Godlike panel under "Port & Domains", put it here, then /friendstools reload.
  enabled: true
  # 0 = website off
  port: 0
  # Only needed WITHOUT DuckDNS: the server's address as players type it in Minecraft, WITHOUT the port
  # (IP or domain), e.g. "123.45.67.89". A full URL like "https://discs.example.com" is used as it is.
  address: ""
  max-size-mb: 50
  # How long an upload link works
  link-minutes: 15
  # Free https (a padlock instead of "Not secure"): make a free name on https://www.duckdns.org, enter the server's
  # IP there, and put the name and your DuckDNS token here. FriendsTools then gets a Let's Encrypt certificate for it
  # (takes about a minute, http until then) and renews it by itself. With this set, "address" can stay empty.
  duckdns-domain: ""   # e.g. "ourserver" for ourserver.duckdns.org
  duckdns-token: ""
  # true = Let's Encrypt test certificates (browsers don't trust them), only for trying it out
  https-staging: false

resource-pack:
  # Server texture pack: put the zip at plugins/FriendsTools/pack.zip. Everyone gets it offered when they join,
  # so custom item textures work without anyone installing anything. It is served by the upload website, so
  # disc-upload.port must be set. After replacing the file: /friendstools reload (online players get it right away).
  enabled: true
  file: pack.zip
  # true = players who decline the pack are kicked
  required: false
  prompt: "<gray>Server textures: custom items and prizes"

custom-items:
  # One-of-a-kind prizes (only-once advancements). Their look comes from pack.zip through a hidden item model,
  # so naming a normal item the same in an anvil does nothing. Give one with /customitem give <player> <id>.
  #   material: the item it is (best tier), model: look from pack.zip, wings: elytra look when worn,
  #   golem: spawns a prize golem with this rig from pack.zip, for: advancement shown in the lore
  bulldozer_drill:
    material: NETHERITE_PICKAXE
    model: friends:bulldozer_drill
    name: "<gradient:#d8d0e0:#6e5a78>Bulldozer Drill</gradient>"
    for: "Bulldozer"
  phantom_wings:
    material: ELYTRA
    model: friends:phantom_wings
    wings: friends:phantom_wings
    name: "<#8fa3ff>Phantom Wings"
    for: "Caves & Cliffs"
  susus_gigantus:
    material: IRON_GOLEM_SPAWN_EGG
    golem: susus_gigantus
    name: "<red>Susus Gigantus"
    lore:
      - "<gray>Spawns a buff iron golem that guards your base."
      - "<gray>If it dies, it drops this egg again."
    for: "sus"
  wardenbane:
    material: MACE
    model: friends:wardenbane
    name: "<#2ad4d4>Wardenbane"
    for: "Warden Extinction"
  dragon_wings:
    material: ELYTRA
    model: friends:dragon_wings
    wings: friends:dragon_wings
    name: "<#b04cff>Dragon Wings"
    for: "At the Rim of the Sky"
  frying_pan:
    material: MACE
    model: friends:frying_pan
    name: "<#c8c8c8>Frying Pan"
    for: "The Next Generation"

buff-golem:
  # Prize golem stats (a normal iron golem has 100 health and 15 attack damage)
  health: 200
  attack-damage: 22

raids:
  # Captains that come with a raid wave drop an ominous bottle (vanilla only drops one outside raids),
  # so raid farms can keep going
  captain-drops-ominous-bottle: true

fixes:
  # Turns attribute swapping back on (Paper's unsupported-settings.update-equipment-on-player-actions: false).
  # Applied right away and written to config/paper-global.yml.
  attribute-swapping: true
  # Get players off cushions, boats, horses etc. when they log out. Otherwise the vehicle is respawned
  # in the lobby at their survival coordinates on the next join (cushions break, horses end up in the lobby).
  dismount-on-quit: true
  # Multiverse-Inventories re-grants advancements when you change world group and labels them
  # "mvinv:suppressed", which Paper then shows in chat. This hides that line.
  hide-mvinv-suppressed: true

weather-fix:
  # Re-sends the correct weather after joining and after changing worlds
  # (fixes rain from survival still showing in the lobby)
  enabled: true

