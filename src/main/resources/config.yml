# FriendsTools config. After editing, run /friendstools reload (or restart).
# Messages use MiniMessage formatting: <red>, <gray>, <yellow>, <b> ...

chestlog:
  enabled: true
  # How many entries are kept per chest/barrel/shulker box (oldest are dropped first)
  max-entries-per-container: 100
  # Entries older than this are removed (0 = keep forever)
  keep-days: 90
  # Entries shown per page in /chestlog
  page-size: 8
  # How far away the container you look at may be
  max-distance: 6

biome:
  enabled: true
  cost-diamonds: 32
  # Worlds where /biome works (Bukkit world names)
  worlds:
    - world
  # true = players can pick every biome the server knows except Nether and End biomes,
  # so biomes added by Minecraft updates (like dappled_forest in 26.3) show up automatically.
  # false = only the biomes in "allowed" below.
  all-overworld-biomes: true
  # Never offered, in both modes. Cave biomes make no sense for a whole chunk.
  blocked:
    - deep_dark
    - dripstone_caves
    - lush_caves
  # Only used when all-overworld-biomes is false. Biome names without "minecraft:".
  allowed:
    - plains
    - sunflower_plains
    - meadow
    - forest
    - flower_forest
    - birch_forest
    - old_growth_birch_forest
    - dark_forest
    - pale_garden
    - cherry_grove
    - taiga
    - old_growth_pine_taiga
    - old_growth_spruce_taiga
    - snowy_taiga
    - snowy_plains
    - ice_spikes
    - grove
    - snowy_slopes
    - swamp
    - mangrove_swamp
    - jungle
    - sparse_jungle
    - bamboo_jungle
    - savanna
    - savanna_plateau
    - windswept_savanna
    - windswept_hills
    - windswept_forest
    - desert
    - badlands
    - wooded_badlands
    - eroded_badlands
    - beach
    - snowy_beach
    - stony_shore
    - river
    - frozen_river
    - mushroom_fields
    - dappled_forest
    - ocean
    - warm_ocean
    - lukewarm_ocean
    - cold_ocean
    - frozen_ocean

team-balance:
  enabled: true
  # A diamond block counts as 9 diamonds
  count-diamond-blocks: true
  # Also count diamonds inside shulker boxes stored in the team ender chest
  count-inside-shulkers: true
  # Also count diamonds inside bundles (any color), including bundles inside shulker boxes
  # and bundles inside bundles
  count-inside-bundles: true
  # Recount all teams every X minutes (0 = only when someone closes the team ender chest)
  recount-minutes: 10

speedrun:
  enabled: true
  # The speedrun worlds. All of them are regenerated on reset (the overworld first).
  worlds:
    - speedrun
    - speedrun_nether
    - speedrun_the_end
  # Players who are in the run get sent here before the reset
  lobby-world: lobby
  # Multiverse-Inventories group of the speedrun worlds. Its inventories, XP, beds, advancements
  # and last locations are wiped on reset. Set to "" to keep them.
  inventory-group: speedrun
  # One new random seed for all speedrun worlds (like vanilla). false = a different seed per world
  same-seed: true
  # Players have to click the reset NPC twice within this many seconds (0 = no second click)
  confirm-seconds: 10
  # Minimum time between two resets
  cooldown-seconds: 60
  # Death and advancement messages from the speedrun worlds are only shown to players in the run,
  # not in global chat and not on Discord
  run-only-messages: true

stasis:
  # A fishing bobber resting on a wooden or weighted pressure plate becomes a lasting link: an invisible
  # armor stand keeps the plate pressed even when the bobber disappears (portal, other world, relog).
  # Using any fishing rod again, from anywhere, removes it and fires the stasis. One link per player.
  enabled: true
  worlds:
    - world
    - world_nether
    - world_the_end

weather-fix:
  # Re-sends the correct weather after joining and after changing worlds
  # (fixes rain from survival still showing in the lobby)
  enabled: true

messages:
  prefix: "<dark_gray>[<gold>Server</gold>]</dark_gray> "
  not-enough-diamonds: "<red>You don't have enough diamonds to do this right now."
  biome-usage: "<gray>Usage: <white>/biome [name]</white> (costs <aqua><cost> diamonds</aqua>, changes the chunk you stand in)"
  biome-unknown: "<red>Unknown or not allowed biome: <white><biome></white>. Use tab to see the list."
  biome-wrong-world: "<red>You can only change biomes in survival."
  biome-done: "<green>This chunk is now <white><biome></white>. <gray>(-<cost> diamonds)"
  chestlog-not-container: "<red>Look at a chest, barrel or shulker box (max <distance> blocks away)."
  chestlog-empty: "<gray>Nothing logged for this container yet."
  chestlog-header: "<gold>Chest log</gold> <gray><x> <y> <z> · page <page>/<pages></gray>"
  chestlog-line: "<dark_gray><ago></dark_gray> <yellow><player></yellow> <white><action></white>"
  teambal-no-team: "<red>You are not in a team."
  teambal-own: "<gray>Team <white><team></white> has <aqua><amount> diamonds</aqua> in its team ender chest."
  teambal-top-header: "<gold>Richest teams</gold> <gray>(diamonds in team ender chest)"
  teambal-top-line: "<gray><rank>.</gray> <white><team></white> <aqua><amount></aqua>"
  teambal-unavailable: "<red>BetterTeams is not installed."
  speedrun-confirm: "<yellow>Click again within <seconds> seconds to reset the speedrun world for everyone.</yellow> <gray>(<players> player(s) in the run right now)"
  speedrun-resetting: "<gold><player></gold> <gray>is resetting the speedrun world...</gray>"
  speedrun-evacuated: "<gray>The speedrun world is being reset, taking you to the lobby."
  speedrun-ready: "<green>The new speedrun world is ready!</green> <gray>Seed: <white><seed></white> · join with</gray> <white>/speedrun</white>"
  speedrun-failed: "<red>The speedrun reset failed. An admin needs to check the console."
  speedrun-busy: "<red>The speedrun world is already being reset."
  speedrun-cooldown: "<red>The speedrun world was just reset. Try again in <seconds>s."
  speedrun-closed: "<red>The speedrun world is being reset right now. Try again in a moment."
  speedrun-disabled: "<red>Speedrun resets are turned off."
  stasis-linked: "<aqua>Stasis linked.</aqua> <gray>Use any fishing rod, from anywhere, to trigger it."
  stasis-triggered: "<aqua>Stasis triggered."
  stasis-missing: "<gray>Your stasis link was already gone (armor stand removed or world reset)."
  stasis-broken: "<gray>Your stasis link was removed because its pressure plate was broken."
  players-only: "<red>Only players can use this."
  reloaded: "<green>FriendsTools config reloaded."
