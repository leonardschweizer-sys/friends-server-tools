name: FriendsTools
version: '${version}'
main: net.friendsserver.tools.FriendsTools
api-version: '1.21'
description: Chest log, biome changer, team diamond balance, speedrun reset, /pvp, death heads, prize items, login and small fixes for our server
softdepend: [BetterTeams, packetevents]

commands:
  chestlog:
    description: Shows who opened or changed the chest, barrel or shulker box you are looking at
    usage: /chestlog [page]
    aliases: [cl]
    permission: friendstools.chestlog
  biome:
    description: Changes the biome of the chunk you are standing in (costs diamonds)
    usage: /biome <biome>
    aliases: [chunkbiome]
    permission: friendstools.biome
  teambal:
    description: Shows how many diamonds are in your team ender chest
    usage: /teambal [top]
    aliases: [tbal]
    permission: friendstools.teambal
  ping:
    description: Shows your ping or another player's ping
    usage: /ping [player]
    permission: friendstools.ping
  pvp:
    description: Turn PvP on or off for yourself (off by default)
    usage: /pvp [on|off]
    permission: friendstools.pvp
  discupload:
    description: Gives you a private link to upload a song (mp3, wav, flac) for a music disc
    usage: /upload
    aliases: [upload]
    permission: friendstools.discupload
  titles:
    description: Pick the title you wear (from advancements), /titles only-once shows who has the rare ones
    usage: /titles [page|<title>|off|only-once]
    permission: friendstools.title
  pack:
    description: Install the server texture pack yourself so it doesn't load on every join
    usage: /pack [local|server]
    aliases: [texturepack]
    permission: friendstools.pack
  customitem:
    description: Gives prize items (for testing), /ci list shows their numbers
    usage: /customitem <number|name|all|list> or /customitem give <player> <number|name|all>
    aliases: [citem, ci]
    permission: friendstools.customitem
  login:
    description: Log in (cracked players)
    usage: /login <password>
    aliases: [l]
  register:
    description: Set your password on your first join (cracked players)
    usage: /register <password> <password>
    aliases: [reg]
  changepassword:
    description: Change your password
    usage: /changepassword <old> <new>
    aliases: [changepw]
  premium:
    description: Protect your name with your Mojang account (checked on every join)
    usage: /premium
  auth:
    description: Login admin commands
    usage: /auth <list|info|setpassword|unregister|protect|unprotect>
    permission: friendstools.auth.admin
  speedrunreset:
    description: Resets the speedrun worlds for everyone (used by the lobby NPC from the console)
    usage: /speedrunreset [player]
    permission: friendstools.speedrun.reset
  progress:
    description: Shows how far you are with an advancement and which parts are done
    usage: /progress <advancement> [page]
    permission: friendstools.progress
  showinv:
    description: Opens a copy of an inventory someone shared with [inventory] in chat (the chat button runs it)
    usage: /showinv <id>
    permission: friendstools.chatshare
  friendstools:
    description: Reloads the FriendsTools config
    usage: /friendstools reload
    permission: friendstools.admin

permissions:
  friendstools.chestlog:
    description: Use /chestlog
    default: true
  friendstools.biome:
    description: Use /biome
    default: true
  friendstools.teambal:
    description: Use /teambal
    default: true
  friendstools.ping:
    description: Use /ping and /ping <player>
    default: true
  friendstools.pvp:
    description: Use /pvp
    default: true
  friendstools.pvp.others:
    description: Set another player's PvP with /pvp <on|off> <player>
    default: op
  friendstools.discupload:
    description: Use /upload
    default: true
  friendstools.title:
    description: Use /titles
    default: true
  friendstools.title.admin:
    description: Give or take titles with /titles give|take <player> <title>
    default: op
  friendstools.pack:
    description: Use /pack
    default: true
  friendstools.customitem:
    description: Give prize items with /customitem (/ci)
    default: op
  friendstools.auth.admin:
    description: Manage login accounts (/auth)
    default: op
  friendstools.speedrun.reset:
    description: Reset the speedrun worlds (the NPC runs it from the console, so players don't need this)
    default: op
  friendstools.progress:
    description: Use /progress
    default: true
  friendstools.chatshare:
    description: Look at inventories shared with [inventory] in chat
    default: true
  friendstools.admin:
    description: Reload the config
    default: op
