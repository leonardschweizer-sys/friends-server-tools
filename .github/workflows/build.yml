name: Build plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: FriendsTools
          path: build/libs/FriendsTools-*.jar
          if-no-files-found: error

      - name: Read version
        id: ver
        run: echo "version=$(sed -nE 's/^version = "(.*)"/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # Puts the jar on the repo's Releases page (direct download, no zip).
      # The same version re-uses its release and replaces the jar.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: FriendsTools ${{ steps.ver.outputs.version }}
          files: build/libs/FriendsTools-*.jar
          make_latest: true
